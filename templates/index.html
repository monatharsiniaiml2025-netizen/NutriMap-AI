<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriMap AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="index-page">

    <div class="index-container">

        <!-- HEADER -->
        <header class="index-header">

            <div class="brand">
                <span class="brand-icon">🥗</span>

                <div>
                    <h1>NutriMap AI</h1>
                    <p>
                        Personalized Health-Aware Recipe Recommendation System
                    </p>
                </div>
            </div>

        </header>


        <!-- FORM -->
        <form action="/recommend" method="POST" class="nutrition-form">

            <div class="form-grid">

                <!-- LEFT COLUMN -->
                <div class="form-column">

                    <div class="form-group">
                        <label>Full Name</label>

                        <input type="text" name="name" placeholder="Enter your name">
                    </div>


                    <div class="form-group">
                        <label>Age</label>

                        <input type="number" name="age" placeholder="Enter age">
                    </div>


                    <div class="form-group">
                        <label>Gender</label>

                        <select name="gender">

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label>Weight (kg)</label>

                        <input type="number" name="weight" placeholder="Example: 65">
                    </div>


                    <div class="form-group">
                        <label>Diet Preference</label>

                        <select name="diet">

                            <option value="Vegetarian">
                                Vegetarian
                            </option>

                            <option value="Non Vegetarian">
                                Non Vegetarian
                            </option>

                            <option value="Vegan">
                                Vegan
                            </option>

                        </select>
                    </div>

                </div>


                <!-- RIGHT COLUMN -->
                <div class="form-column">

                    <div class="form-group">
                        <label>Height (cm)</label>

                        <input type="number" name="height" placeholder="Example: 170">
                    </div>


                    <div class="form-group">
                        <label>Health Condition</label>

                        <select name="condition">

                            <option value="None">
                                None
                            </option>

                            <option value="Diabetes">
                                Diabetes
                            </option>

                            <option value="Hypertension">
                                Hypertension
                            </option>

                            <option value="Obesity">
                                Obesity
                            </option>

                            <option value="Heart Disease">
                                Heart Disease
                            </option>

                            <option value="Thyroid">
                                Thyroid
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label>Health Goal</label>

                        <select name="goal">

                            <option value="Weight Loss">
                                Weight Loss
                            </option>

                            <option value="Weight Gain">
                                Weight Gain
                            </option>

                            <option value="Maintain Weight">
                                Maintain Weight
                            </option>

                        </select>
                    </div>


                    <div class="form-group">
                        <label>Food Allergy</label>

                        <input type="text" name="allergy" placeholder="Example: Peanut, Milk">
                    </div>


                    <div class="form-group">
                        <label>Available Ingredients</label>

                        <textarea name="ingredients" placeholder="Example: Rice, Tomato, Onion, Carrot"></textarea>
                    </div>

                </div>

            </div>


            <!-- BUTTON -->
            <div class="form-button">

                <button type="submit">
                    Get Personalized Recipes
                </button>

            </div>

        </form>

    </div>

</body>

</html>
