<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NutriMap AI - Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #f3faf7;
            color: #123c35;
        }


        .register-container {

            width: 430px;
            max-width: 92%;

            background: white;

            padding: 38px;

            border-radius: 22px;

            border: 1px solid #d8e9e1;

            box-shadow:
                0 10px 30px rgba(25, 90, 65, 0.10);
        }


        .logo {

            text-align: center;

            font-size: 38px;

            font-weight: 700;

            color: #278c5b;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #71847e;

            font-size: 16px;

            margin-bottom: 30px;
        }


        h2 {

            text-align: center;

            color: #174f43;

            margin-bottom: 25px;
        }


        label {

            display: block;

            font-weight: 600;

            margin-bottom: 7px;

            color: #244f45;
        }


        input {

            width: 100%;

            padding: 13px 14px;

            margin-bottom: 18px;

            border: 1px solid #d2e1dc;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            background: #fafdfc;
        }


        input:focus {

            border-color: #2d945e;

            box-shadow:
                0 0 0 3px rgba(45, 148, 94, 0.10);
        }


        .register-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #2d945e;

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;
        }


        .register-button:hover {

            background: #247c4e;
        }


        .message {

            background: #fff4f2;

            color: #b64a3b;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;
        }


        .login-link {

            text-align: center;

            margin-top: 22px;

            color: #647b76;
        }


        .login-link a {

            color: #278c5b;

            font-weight: 600;

            text-decoration: none;
        }


        .login-link a:hover {

            text-decoration: underline;
        }
    </style>

</head>


<body>

    <div class="register-container">

        <div class="logo">
            🥗 NutriMap AI
        </div>

        <div class="subtitle">
            Personalized Nutrition & Recipe Recommendation
        </div>


        <h2>Create Account</h2>


        {% if message %}

        <div class="message">
            {{ message }}
        </div>

        {% endif %}


        <form method="POST">

            <label>
                Full Name
            </label>

            <input type="text" name="full_name" placeholder="Enter your full name" required>


            <label>
                Email
            </label>

            <input type="email" name="email" placeholder="Enter your email" required>


            <label>
                Password
            </label>

            <input type="password" name="password" placeholder="Enter password" required>


            <label>
                Confirm Password
            </label>

            <input type="password" name="confirm_password" placeholder="Confirm your password" required>


            <button type="submit" class="register-button">

                Create Account

            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</body>

</html>
